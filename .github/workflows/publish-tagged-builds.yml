name: Publish tagged builds

# Builds every listed git tag and attaches rpgmechanics-*.jar to a GitHub Release.
# Runs when this file is pushed (bootstrap) or from Actions → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-tagged-builds.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.1.0, v0.1.1, v0.1.2, v0.1.3, v0.1.4, v0.1.5]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ matrix.tag }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Resolve version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ matrix.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: RPG Mechanics ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: ${{ matrix.tag == 'v0.1.5' }}
          files: |
            build/libs/rpgmechanics-${{ steps.ver.outputs.version }}.jar
            extras/shader-patches/photon/simple_fog.glsl
          fail_on_unmatched_files: false
          body: |
            Minecraft **1.21.1** · NeoForge **21.1.235+** · Java **21**

            Drop `rpgmechanics-${{ steps.ver.outputs.version }}.jar` into your instance `mods` folder.

            Guide: https://github.com/Ankinkun/RPG-Mechanics#rpg-mechanics
